<!-- Mobile version - Single column -->
<svg viewBox="0 0 620 620" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 14px; fill: #1a202c; }
        .content { font-size: 11px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="84" rx="6"/>
        <rect x="16" y="16" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="42">Accessible Navigation</text>
        <text class="content" x="32" y="66">aria-current, aria-label, aria-controls wired into Menu and Toggle</text>
        <text class="content" x="32" y="84">First/last item classes and active link state for keyboard users</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="116" width="588" height="84" rx="6"/>
        <rect x="16" y="116" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="142">Composable Primitives</text>
        <text class="content" x="32" y="166">BaseAlert, BaseBreadcrumb, BaseDropdown, BaseNavBar, BaseToggle</text>
        <text class="content" x="32" y="184">Reusable base classes for building consistent UI component families</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="216" width="588" height="84" rx="6"/>
        <rect x="16" y="216" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="242">Framework-Friendly Hooks</text>
        <text class="content" x="32" y="266">Data attributes for Bootstrap, Flowbite, Tailwind UI integrations</text>
        <text class="content" x="32" y="284">Toggle components emit data-bs-*, data-collapse-*, data-drawer-* hooks</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="316" width="588" height="84" rx="6"/>
        <rect x="16" y="316" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="342">html-core Foundation</text>
        <text class="content" x="32" y="366">Built on UIAwesome\Html\Core\Element\BaseBlock with Fiber-aware rendering</text>
        <text class="content" x="32" y="384">Shares contracts, helpers, mixins with the rest of the UI Awesome line</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="416" width="588" height="84" rx="6"/>
        <rect x="16" y="416" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="442">Immutable Fluent API</text>
        <text class="content" x="32" y="466">Every setter returns a new instance for safe composition</text>
        <text class="content" x="32" y="484">Clone-based state management with cookbook factory defaults</text>
    </g>
    <g>
        <rect class="box-bg" x="16" y="516" width="588" height="84" rx="6"/>
        <rect x="16" y="516" width="4" height="84" fill="#1f883d"/>
        <text class="title" x="32" y="542">Menu &amp; Item Engine</text>
        <text class="content" x="32" y="566">Menu and Item classes drive breadcrumbs, dropdowns, and nav menus</text>
        <text class="content" x="32" y="584">Active-path matching, dividers, prefix/suffix items, link wrappers</text>
    </g>
</svg>
