<svg viewBox="0 0 1200 380" width="100%" height="340" xmlns="http://www.w3.org/2000/svg">
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Accessible Navigation</text>
        <text class="content" x="40" y="78">aria-current, aria-label, aria-controls wired into Menu and Toggle</text>
        <text class="content" x="40" y="98">First/last item classes and active link state for keyboard users</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Composable Primitives</text>
        <text class="content" x="630" y="78">BaseAlert, BaseBreadcrumb, BaseDropdown, BaseNavBar, BaseToggle</text>
        <text class="content" x="630" y="98">Reusable base classes for building consistent UI component families</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Framework-Friendly Hooks</text>
        <text class="content" x="40" y="198">Data attributes for Bootstrap, Flowbite, Tailwind UI integrations</text>
        <text class="content" x="40" y="218">Toggle components emit data-bs-*, data-collapse-*, data-drawer-* hooks</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">html-core Foundation</text>
        <text class="content" x="630" y="198">Built on UIAwesome\Html\Core\Element\BaseBlock with Fiber-aware rendering</text>
        <text class="content" x="630" y="218">Shares contracts, helpers, mixins with the rest of the UI Awesome line</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Immutable Fluent API</text>
        <text class="content" x="40" y="318">Every setter returns a new instance for safe composition</text>
        <text class="content" x="40" y="338">Clone-based state management with cookbook factory defaults</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Menu &amp; Item Engine</text>
        <text class="content" x="630" y="318">Menu and Item classes drive breadcrumbs, dropdowns, and nav menus</text>
        <text class="content" x="630" y="338">Active-path matching, dividers, prefix/suffix items, link wrappers</text>
    </g>
</svg>
